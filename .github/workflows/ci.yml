name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: |
          shellcheck -x -P . pimake
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck -x -P .

  dispatcher:
    name: Dispatcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bare invocation prints usage
        run: ./pimake
      - name: --help prints usage
        run: ./pimake --help
      - name: unknown command exits 1
        run: '! ./pimake badcmd'
      - name: init
        run: ./pimake init

  pipeline:
    name: Build ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [raspbian-lite, raspbian, ubuntu]
    steps:
      - uses: actions/checkout@v4

      - name: init
        run: |
          ./pimake init
          sed -i "s/^source_image_distro=.*/source_image_distro=${{ matrix.distro }}/" conf/pimake.local
          sed -i 's/^ssh_configure_enabled=.*/ssh_configure_enabled=1/' conf/pimake.local
          sed -i 's/^serial_console_enabled=.*/serial_console_enabled=1/' conf/pimake.local
          sed -i 's/^wpa_network_enabled=.*/wpa_network_enabled=1/' conf/pimake.local
          sed -i 's/^gsm_network_enabled=.*/gsm_network_enabled=1/' conf/pimake.local
          sed -i 's/^user_configure_enabled=.*/user_configure_enabled=1/' conf/pimake.local
          sed -i 's/^user_name=.*/user_name=pimake/' conf/pimake.local
          sed -i 's/^user_password=.*/user_password=testpassword/' conf/pimake.local
          echo 'user_ssh_public_key="ssh-ed25519 AAAAtest ci@pimake"' >> conf/pimake.local

      - name: Cache image package
        uses: actions/cache@v4
        with:
          path: workspace/package
          key: image-${{ matrix.distro }}-${{ hashFiles(format('conf/distro/{0}/index.conf', matrix.distro)) }}

      - name: fetch
        run: ./pimake fetch

      - name: unpack
        run: ./pimake unpack

      - name: build
        run: sudo ./pimake build

      - name: pack
        run: ./pimake pack

      - name: get archive name
        id: image
        run: |
          source "conf/distro/${{ matrix.distro }}/index.conf"
          echo "archive=${source_image_archive}" >> "$GITHUB_OUTPUT"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image.outputs.archive }}
          path: workspace/build/${{ steps.image.outputs.archive }}

  emulate:
    name: Emulate ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [raspbian-lite, ubuntu]
    env:
      DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and mtools
        run: sudo apt-get install -y qemu-system-arm qemu-system-aarch64 mtools

      - name: generate SSH key
        run: ssh-keygen -t ed25519 -N "" -f ci_key

      - name: init workspace
        run: |
          ./pimake init
          sed -i "s/^source_image_distro=.*/source_image_distro=${{ env.DISTRO }}/" conf/pimake.local
          sed -i 's/^ssh_configure_enabled=.*/ssh_configure_enabled=1/' conf/pimake.local
          sed -i 's/^user_configure_enabled=.*/user_configure_enabled=1/' conf/pimake.local
          sed -i 's/^user_name=.*/user_name=pimake/' conf/pimake.local
          sed -i 's/^user_password=.*/user_password=testpassword/' conf/pimake.local
          echo "user_ssh_public_key=\"$(cat ci_key.pub)\"" >> conf/pimake.local

      - name: Cache image package
        uses: actions/cache@v4
        with:
          path: workspace/package
          key: image-${{ env.DISTRO }}-${{ hashFiles(format('conf/distro/{0}/index.conf', env.DISTRO)) }}

      - name: fetch
        run: ./pimake fetch

      - name: unpack
        run: ./pimake unpack

      - name: build
        run: sudo ./pimake build

      - name: start VM
        run: ./pimake vm start

      - name: capture VM info
        run: |
          state=$(ls -t workspace/qemu/*.state | head -1)
          echo "VM_PID=$(grep '^qemu_pid=' "$state" | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "VM_SSH_PORT=$(grep '^qemu_ssh_port=' "$state" | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: list VMs
        run: ./pimake vm list

      - name: show VM
        run: ./pimake vm show --pid "$VM_PID"

      - name: wait for SSH and smoke test
        timeout-minutes: 25
        run: |
          log="workspace/qemu/qemu-${VM_SSH_PORT}.log"
          echo "=== QEMU log so far ==="
          cat "$log" 2>/dev/null || true
          echo "=== polling for login prompt (up to 20 min) ==="
          deadline=$(( $(date +%s) + 1200 ))
          last_report=0
          while true; do
            now=$(date +%s)
            if grep -q 'login:' "$log" 2>/dev/null; then
              echo ""
              echo "login prompt detected after $(( now - (deadline - 1200) ))s"
              break
            fi
            if [ "$now" -ge "$deadline" ]; then
              echo ""
              echo "Timeout: guest never reached login prompt after 20 minutes" >&2
              echo "--- QEMU log (last 60 lines) ---" >&2
              tail -60 "$log" >&2
              exit 1
            fi
            if [ $(( now - last_report )) -ge 120 ]; then
              echo ""
              echo "--- still booting ($(( now - (deadline - 1200) ))s elapsed), last log line: ---"
              tail -1 "$log" 2>/dev/null || true
              last_report=$now
            fi
            printf '.'
            sleep 1
          done
          echo "connecting via SSH..."
          for i in 1 2 3 4 5; do
            if out=$(ssh -i ci_key \
                         -o StrictHostKeyChecking=no \
                         -o BatchMode=yes \
                         -o ConnectTimeout=10 \
                         -p "$VM_SSH_PORT" \
                         pimake@localhost 'uname -a && cat /etc/os-release' 2>&1); then
              echo "--- smoke test output ---"
              echo "$out"
              echo "-------------------------"
              echo "SSH smoke test passed"
              exit 0
            fi
            sleep 3
          done
          echo "SSH failed after login prompt appeared" >&2
          echo "--- QEMU log (last 60 lines) ---" >&2
          tail -60 "$log" >&2
          exit 1

      - name: stop VM
        if: always()
        run: |
          if [ -n "${VM_PID:-}" ]; then
            ./pimake vm stop --pid "$VM_PID" || true
          fi
