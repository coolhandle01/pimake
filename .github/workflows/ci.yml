name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: |
          shellcheck -x -P . pimake
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck -x -P .

  dispatcher:
    name: Dispatcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bare invocation prints usage
        run: ./pimake
      - name: --help prints usage
        run: ./pimake --help
      - name: unknown command exits 1
        run: '! ./pimake badcmd'
      - name: init
        run: ./pimake init

  pipeline:
    name: Build ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [raspbian-lite, raspbian, ubuntu]
    steps:
      - uses: actions/checkout@v4

      - name: init
        run: |
          ./pimake init
          sed -i "s/^source_image_distro=.*/source_image_distro=${{ matrix.distro }}/" conf/pimake.local
          sed -i 's/^ssh_configure_enabled=.*/ssh_configure_enabled=1/' conf/pimake.local
          sed -i 's/^serial_console_enabled=.*/serial_console_enabled=1/' conf/pimake.local
          sed -i 's/^wpa_network_enabled=.*/wpa_network_enabled=1/' conf/pimake.local
          sed -i 's/^gsm_network_enabled=.*/gsm_network_enabled=1/' conf/pimake.local
          sed -i 's/^user_configure_enabled=.*/user_configure_enabled=1/' conf/pimake.local
          sed -i 's/^user_name=.*/user_name=pimake/' conf/pimake.local
          sed -i 's/^user_password=.*/user_password=testpassword/' conf/pimake.local
          echo 'user_ssh_public_key="ssh-ed25519 AAAAtest ci@pimake"' >> conf/pimake.local

      - name: Cache image package
        uses: actions/cache@v4
        with:
          path: workspace/package
          key: image-${{ matrix.distro }}-${{ hashFiles(format('conf/distro/{0}/index.conf', matrix.distro)) }}

      - name: fetch
        run: ./pimake fetch

      - name: unpack
        run: ./pimake unpack

      - name: build
        run: sudo ./pimake build

      - name: pack
        run: ./pimake pack

      - name: get archive name
        id: image
        run: |
          source "conf/distro/${{ matrix.distro }}/index.conf"
          echo "archive=${source_image_archive}" >> "$GITHUB_OUTPUT"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image.outputs.archive }}
          path: workspace/build/${{ steps.image.outputs.archive }}

  emulate:
    name: Emulate raspbian-lite
    runs-on: ubuntu-latest
    env:
      DISTRO: raspbian-lite
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and mtools
        run: sudo apt-get install -y qemu-system-arm mtools

      - name: init workspace
        run: |
          ./pimake init
          sed -i "s/^source_image_distro=.*/source_image_distro=${{ env.DISTRO }}/" conf/pimake.local
          sed -i 's/^ssh_configure_enabled=.*/ssh_configure_enabled=1/' conf/pimake.local
          sed -i 's/^user_configure_enabled=.*/user_configure_enabled=1/' conf/pimake.local
          sed -i 's/^user_name=.*/user_name=pimake/' conf/pimake.local
          sed -i 's/^user_password=.*/user_password=testpassword/' conf/pimake.local

      - name: Cache image package
        uses: actions/cache@v4
        with:
          path: workspace/package
          key: image-${{ env.DISTRO }}-${{ hashFiles(format('conf/distro/{0}/index.conf', env.DISTRO)) }}

      - name: fetch
        run: ./pimake fetch

      - name: unpack
        run: ./pimake unpack

      - name: build
        run: sudo ./pimake build

      - name: get image name
        id: image
        run: |
          source "conf/distro/${{ env.DISTRO }}/index.conf"
          echo "name=${source_image_name}" >> "$GITHUB_OUTPUT"

      - name: start VM
        run: ./pimake vm start

      - name: list VMs
        run: ./pimake vm list

      - name: show VM
        run: ./pimake vm show ${{ steps.image.outputs.name }}

      - name: verify still running after 10s
        run: |
          sleep 10
          ./pimake vm list
          ./pimake vm show ${{ steps.image.outputs.name }}

      - name: stop VM
        if: always()
        run: ./pimake vm stop || true
